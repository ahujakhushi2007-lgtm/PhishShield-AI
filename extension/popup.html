<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishShield AI Scanner</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #070B14;
      color: #F8FAFC;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 {
      margin: 0;
      font-size: 15px;
      color: #22D3EE;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #0D1424;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #FFF;
      padding: 8px 10px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      background: #22D3EE;
      color: #070B14;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      padding: 9px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #38BDF8;
    }
    .result-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #0D1424;
      border: 1px solid rgba(255,255,255,0.1);
      display: none;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .badge.DANGEROUS { background: rgba(244,63,94,0.2); color: #F43F5E; border: 1px solid #F43F5E; }
    .badge.SUSPICIOUS { background: rgba(245,158,11,0.2); color: #F59E0B; border: 1px solid #F59E0B; }
    .badge.SAFE { background: rgba(16,185,129,0.2); color: #10B981; border: 1px solid #10B981; }
    .score {
      font-size: 20px;
      font-weight: 800;
      float: right;
    }
    .explanation {
      font-size: 12px;
      color: #94A3B8;
      line-height: 1.4;
      clear: both;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🛡️</span>
    <h1>PhishShield AI Radar</h1>
  </div>

  <textarea id="scanInput" rows="3" placeholder="Paste link, SMS, or WhatsApp message to inspect..."></textarea>
  <button id="scanBtn">Quick Scan</button>

  <div id="resultBox" class="result-box">
    <div id="scoreDisplay" class="score">--</div>
    <span id="verdictBadge" class="badge">ANALYZING</span>
    <p id="explanationText" class="explanation"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
